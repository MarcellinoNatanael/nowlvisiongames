  <style>
    body {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #111111;
      color: #fff;
      font-family: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif;
      line-height: 1.6;
    }
    h1 { margin: 0 0 24px; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
    .job {
      margin-bottom: 20px;
      padding: 20px 24px;
      background: #1a1a1a;
      border-left: 4px solid #8B0000;
    }
    .job::before {
      content: attr(data-department) " / " attr(data-division) " / " attr(data-contract) " / " attr(data-location) " / " attr(data-date);
      font-size: 13px;
      color: rgba(255,255,255,.7);
    }
    .job::after {
      content: "ID: " attr(data-id) " | Apply: " attr(data-apply);
      display: block;
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255,255,255,.55);
      overflow-wrap: anywhere;
    }
    .job-title { margin: 6px 0 12px; font-size: 22px; text-transform: uppercase; }
    section { margin-top: 14px; }
    section::before {
      display: block;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.6);
    }
    section[data-section="responsibilities"]::before { content: "Responsibilities"; }
    section[data-section="requirements"]::before     { content: "Requirements"; }
    section[data-section="benefits"]::before         { content: "What You Get"; }
    section[data-section="how-to-apply"]::before     { content: "How To Apply"; }
    ul { margin: 6px 0 0; padding-left: 20px; }
    li::marker { color: #8B0000; }
    p { margin: 6px 0 0; color: rgba(255,255,255,.85); }
    .empty-note { padding: 20px 24px; background: #1a1a1a; border-left: 4px solid #8B0000; }
    body:has(article.job) .empty-note { display: none; }
  </style>
</head>

  ================================================================
  PANDUAN MENGURUS LOWONGAN
  Cukup edit file ini. Halaman Careers membaca semua blok <article> di bawah.
  ================================================================

  MENAMBAH LOWONGAN
    Salin blok TEMPLATE di bagian bawah panduan ini (atau salin satu blok
    <article> yang sudah ada), tempel tepat di bawah baris <h1>Data Lowongan</h1>
    (di luar komentar panduan ini), lalu ganti isinya.
    Urutan blok bebas, karena daftar otomatis urut dari tanggal terbaru.

  MENGEDIT LOWONGAN
    Ubah teks atau nilai atribut di blok yang bersangkutan.

  MENGHAPUS LOWONGAN
    Hapus seluruh bloknya, mulai dari <article ...> sampai </article>.
    Kalau semua blok dihapus, halaman menampilkan pesan belum ada lowongan.

  ARTI ATRIBUT
    data-id          Kode unik lowongan, dipakai di alamat halaman detail
                     (career_detail.html?id=kode-ini).
                     Aturan: huruf kecil, pakai tanda hubung, unik, tanpa spasi.
                     Contoh: game-tester-intern
    data-department  Nama departemen, misalnya Quality, Art, Audio.
    data-division    Nama divisi, misalnya Porting, Full Development Cycle.
    data-contract    Jenis kontrak: Internship, Freelance, Full-time, Part-time, atau Contract.
    data-location    Lokasi kerja, misalnya Remote. Dipakai di deskripsi untuk Google.
    data-date        Tanggal posting dengan format YYYY-MM-DD. Contoh: 2026-11-08
    data-apply       Link Google Form, atau # kalau belum ada.

    Pilihan di dropdown filter terisi otomatis dari data-department, data-division,
    dan data-contract, jadi tidak perlu diatur terpisah.

  BAGIAN ISI
    responsibilities  Daftar tanggung jawab. Satu poin = satu <li>.
    requirements      Daftar persyaratan. Satu poin = satu <li>.
    benefits          Daftar "What You Get". Satu poin = satu <li>.
    how-to-apply      Satu paragraf ajakan melamar.

  CATATAN
    Blok tanpa data-id atau tanpa judul akan dilewati.
    Kalau ada data-id yang sama, hanya blok pertama yang dipakai.
    Peringatannya muncul di Console browser (F12).
